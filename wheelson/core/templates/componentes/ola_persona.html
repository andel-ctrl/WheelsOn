{% load wheelson_ui %}
{# La ola coral y ciruela: su forma depende de la persona. #}
<svg class="{{ clase }}" viewBox="0 0 220 300" preserveAspectRatio="none" aria-hidden="true" focusable="false">
    <defs><linearGradient id="persona-coral-{{ p.uid }}" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#F0705F"/><stop offset="1" stop-color="#FF9F91"/></linearGradient></defs>
    {% with v=p.uid|variante %}
    {% if v == 0 %}<path fill="url(#persona-coral-{{ p.uid }})" d="M0 0H150C110 40 80 90 40 110C20 120 10 150 0 170Z"/><path fill="#3B2147" d="M150 0H185C130 45 105 95 62 120C28 140 18 190 40 240C55 270 75 285 95 300H60C20 270 0 225 0 190V170C10 150 20 120 40 110C80 90 110 40 150 0Z"/><path fill="url(#persona-coral-{{ p.uid }})" d="M0 225C12 260 32 285 60 300H0Z"/>
    {% elif v == 1 %}<path fill="#3B2147" d="M0 0H175C135 30 120 85 70 105C30 122 10 170 22 225C28 255 42 280 62 300H0Z"/><path fill="url(#persona-coral-{{ p.uid }})" d="M0 0H125C95 30 75 70 40 88C18 100 6 125 0 150Z"/><path fill="url(#persona-coral-{{ p.uid }})" d="M0 240C10 265 22 285 38 300H0Z"/>
    {% else %}<path fill="url(#persona-coral-{{ p.uid }})" d="M0 0H190C150 35 115 60 75 90C35 120 20 175 35 230C42 258 58 282 78 300H0Z"/><path fill="#3B2147" d="M0 110C16 90 34 80 52 70C30 105 14 150 18 205C21 245 32 275 48 300H12C2 275 0 250 0 225Z"/>
    {% endif %}
    {% endwith %}
</svg>
