{# Encabezado editorial de una sección: el título y, a su lado, la cifra real. #}
<header class="ws-seccion">
    <div>
        <h1 class="ws-seccion__titulo">{{ titulo }}</h1>
        <p class="ws-seccion__bajada">{{ bajada }}</p>
    </div>
    <p class="ws-seccion__cifra"><strong>{{ total }}</strong>{{ unidad }}</p>
</header>
